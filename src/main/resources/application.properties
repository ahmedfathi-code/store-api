spring.application.name=product_store
#database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_store_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT (must be at least 32 characters)
jwt.secret=${JWT_SECRET}


# JPA / Hibernate
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# App Port
server.port=8080