spring.application.name=product_store
#database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_store_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT (must be at least 32 characters)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:15m}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:7d}

# Redis (refresh tokens, access-token blacklist)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Fail fast (503) instead of hanging requests when Redis is unreachable
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# JPA / Hibernate
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# App Port
server.port=8080