spring.application.name=product_store
#database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_store_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT (must be at least 32 characters)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:15m}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:7d}

# Optional admin seed: creates this ADMIN on startup if it doesn't exist (see AdminSeeder)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Redis (refresh tokens, access-token blacklist)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Fail fast (503) instead of hanging requests when Redis is unreachable
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# JPA / Hibernate
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
# SQL logging is off by default (noisy, and logs every query); SHOW_SQL=true for local debugging
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Messages (messages.properties = English, messages_ar.properties = Arabic); never fall back
# to the server's OS locale, so a missing translation shows English
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# App Port
server.port=8080

# Actuator: expose only the health endpoint (used by Docker health checks),
# without component details, so it leaks nothing about DB/Redis to anonymous callers
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI: spec at /v3/api-docs, Swagger UI at /swagger-ui.html (OPENAPI_ENABLED=false turns both off)
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Rate limiting of failed password attempts (fixed windows in Redis; see LoginAttemptService)
rate-limit.window=${RATE_LIMIT_WINDOW:15m}
rate-limit.login.per-account=${RATE_LIMIT_LOGIN_PER_ACCOUNT:5}
rate-limit.login.per-ip=${RATE_LIMIT_LOGIN_PER_IP:30}
rate-limit.change-password=${RATE_LIMIT_CHANGE_PASSWORD:5}
