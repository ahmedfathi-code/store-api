auth.invalidToken=Invalid, expired or revoked token
auth.accessDenied=Access denied
auth.unavailable=Authentication service unavailable
auth.password.currentIncorrect=Current password is incorrect
auth.password.tooShort=New password must be at least {0} characters
auth.password.unchanged=New password must be different from the current one

# --- products ---
product.notFound=Product not found with id: {0}

