spring.application.name=product_store

# Database and Redis come from Testcontainers (@ServiceConnection in
# TestcontainersConfiguration); the schema is created by Flyway and validated.
spring.jpa.hibernate.ddl-auto=validate

# Dummy test-only key (not used anywhere else)
jwt.secret=test-only-jwt-secret-key-at-least-32-chars
jwt.access-token-expiration=15m
jwt.refresh-token-expiration=7d

# Same Actuator exposure as production
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Same message setup as production
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false
