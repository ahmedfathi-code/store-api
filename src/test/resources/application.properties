spring.application.name=product_store

# In-memory database for tests, no external Postgres needed.
# PostgreSQL mode so the real Flyway migrations run here too.
spring.datasource.url=jdbc:h2:mem:product_store_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate

# Dummy test-only key (not used anywhere else)
jwt.secret=test-only-jwt-secret-key-at-least-32-chars
